name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Disposable GitHub-hosted VM per run: pull requests can run arbitrary scripts,
    # so they must never land on a persistent self-hosted runner with the maintainer's filesystem credentials.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/cache@v4
        with:
          path: ~/.foundry/cache
          key: foundry-rpc-cache-base-57172000
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @ai-loan-agent/web test:reserve-postgres-locks
        env:
          PG_LOCK_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: pnpm test
      - run: pnpm build
